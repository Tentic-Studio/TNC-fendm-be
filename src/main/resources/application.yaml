spring:
  application:
    name: tnc-fandm-be
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:fandm_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  flyway:
    enabled: true
    validate-on-migrate: true
    clean-disabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    schemas: public

jwt:
  secret: ${JWT_SECRET:/xso/oBx5RJs3fmXZniRxpItJDyW3W3bitamrtvByDR/ArHIudN4TrmGRd9ESzLDwNoAnbiv9cOqv97FvlP/tw==}
  expiration: ${JWT_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

